<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JFK pacotes turísticos</title>
		<link rel="stylesheet" href="./assets/global.css" />
		<link rel="stylesheet" href="./assets/auth.css" />
		<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
	</head>
	<body>
		<main>
			<div class="image" alt="Imagem de fundo da página de login"></div>
			<div class="login">
				<img class="logo" src="./assets/company-logo.png" alt="Logo da empresa JFK pacotes turísticos" />
				<h2>É um prazer ter você aqui novamente</h2>
				<form>
					<div class="field">
						<label for="email">Email</label>
						<input class="input" type="email" id="email" name="email" required />
					</div>
					<div class="field">
						<label for="password">Senha</label>
						<input class="input" type="password" id="password" name="password" required />
					</div>
					<div class="options">
						<div class="toggle">
							<input type="checkbox" id="remember-me" name="remember-me" />
							<label for="remember-me">Lembrar-me</label>
						</div>
						<a href="#">Esqueceu sua senha?</a>
					</div>
					<a href="/payment-details.html">
						<button type="button" class="button primary">Entrar</button>
					</a>
					<p>
						Não possui uma conta?
						<a href="/register.html">Cadastre-se</a>
					</p>
				</form>
			</div>
		</main>
	</body>
</html>
